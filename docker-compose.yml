services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./agent_prompts:/app/agent_prompts
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=sqlite:///./data/jobs.db
      - DATA_DIR=/app/data
      - AGENT_PROMPTS_DIR=/app/agent_prompts
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-medium}
      - FRAME_EXTRACT_INTERVAL=${FRAME_EXTRACT_INTERVAL:-5}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-500}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  data:
