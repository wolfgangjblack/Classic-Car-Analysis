[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-car-analysis"
version = "1.0.0"
description = "AI-powered pipeline for analyzing classic car videos: transcription, multi-agent NLP, vision condition scoring, and market valuation."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Wolfgang Black"},
]

dependencies = [
    "openai==2.2.0",
    "tenacity==9.1.4",
    "opencv-python==4.11.0.86",
    "pillow==11.1.0",
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.22",
    "sqlalchemy==2.0.40",
    "yt-dlp==2026.3.17",
    "typer==0.16.1",
    "rich==13.9.4",
    "python-dotenv==1.1.0",
    "pydantic==2.11.3",
    "pydantic-settings==2.11.0",
    "tqdm==4.67.1",
    "requests==2.32.3",
]

[project.optional-dependencies]
local-whisper = [
    "openai-whisper==20240930",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
    "transformers==4.49.0",
    "accelerate==1.4.0",
]
dev = [
    "pytest==9.0.2",
    "pytest-cov==6.1.1",
    "httpx==0.28.1",
    "ruff==0.11.4",
    "mypy==1.20.0",
]

[project.scripts]
car-analysis = "backend.cli.main:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.setuptools.packages.find]
include = ["backend*"]
